<!DOCTYPE html>
<html lang="de">
<head>
  <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1DD1A1">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DAVI">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DAVI 3.0</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f8;
      color: #2C3E50;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }

    .header {
      background: white;
      border-radius: 20px;
      padding: 30px 20px;
      margin-top: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 32px;
    }

    .subtitle {
      color: #1DD1A1;
      font-size: 18px;
      font-weight: bold;
    }

    .problem-list {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .problem-button {
      width: 100%;
      padding: 22px;
      border: none;
      border-radius: 18px;
      background: white;
      color: #2C3E50;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .problem-button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>Hey! Ich bin DAVI 👋</h1>
      <div class="subtitle">
        Wobei brauchst du Hilfe?
      </div>
    </div>

    <div class="problem-list">

      <button class="problem-button">
        📱 App geht nicht auf
      </button>

      <button class="problem-button">
        ⚙️ App & Einstellungen gehen nicht
      </button>

      <button class="problem-button">
        🌐 Kein Netz / Internet
      </button>

      <button class="problem-button">
        📷 Scannen / Kamera geht nicht
      </button>

      <button class="problem-button">
        ⏳ Scanner hängt
      </button>

      <button class="problem-button">
        📋 Projekt / SMA fehlt
      </button>

      <button class="problem-button">
        🔳 QR-Code geht nicht
      </button>

      <button class="problem-button">
        ⬆️ Update machen
      </button>

      <button class="problem-button">
        🔒 Scanner gesperrt
      </button>

    </div>

  </div>

  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('./service-worker.js')
        .then(function(registration) {
          console.log('DAVI Service Worker aktiv:', registration.scope);
        })
        .catch(function(error) {
          console.log('Service Worker Fehler:', error);
        });
    });
  }
</script>
</body>
</html>
